<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fleet Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="panel">
    <h1>Fleet Management</h1>

    <h2>Create New Ship</h2>
    <input id="name" placeholder="Ship Name">
    <input id="hull" placeholder="Hull Type (Frigate, Cruiser, etc.)">
    <button onclick="createShip()">Add Ship</button>

    <hr>

    <h2>Fleet</h2>
    <ul id="shipList"></ul>

    <hr>

    <div id="componentSection" style="display:none;">
        <h2 id="selectedShipName">Components</h2>

        <h3>Install Component</h3>
        <input id="compName" placeholder="Component Name">
        <select id="compType">
            <option value="Weapon">Weapon</option>
            <option value="Shield">Shield</option>
            <option value="Engine">Engine</option>
            <option value="Utility">Utility</option>
        </select>
        <input id="compPower" type="number" placeholder="Power Usage">
        <button onclick="addComponent()">Install Component</button>

        <h3>Installed Components</h3>
        <ul id="componentList"></ul>
    </div>

    <hr>
    <button onclick="location.href='dashboard.html'">⬅ Back to Dashboard</button>
</div>

<script src="js/api.js"></script>
<script src="js/ships.js"></script>
</body>
</html>
